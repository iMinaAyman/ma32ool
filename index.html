function discs(bid){const cs=S.coupons.filter(c=>c.brandId==bid),today=new Date().toISOString().slice(0,10);
return `<h2>${t('Discounts & coupons','الخصومات والكوبونات')}</h2><div class=card><div class=f><label>${t('Code','الكود')}<input id=dc maxlength=15 style="text-transform:uppercase"></label><label>${t('Discount %','الخصم %')}<input id=dp type=number min=1 max=90></label><label>${t('Expires','ينتهي في')}<input id=de type=date min="${today}"></label></div><button class=btn style="margin-top:10px" onclick="run(()=>api.saveCoupon($('#dc').value,+$('#dp').value,$('#de').value),t('Coupon created','تم إنشاء الكوبون'))">${I('plus')}${t('Create coupon','إنشاء كوبون')}</button><p class=m>${t('Product-level discounts are set inside each product.','خصومات المنتجات تُضبط داخل كل منتج.')}</p></div>
<div class="card tw" style="margin-top:12px"><table class=rt><thead><tr><th>${t('Code','الكود')}</th><th>%</th><th>${t('Expires','ينتهي')}</th><th>${t('Status','الحالة')}</th><th></th></tr></thead>${cs.map(c=>{const ex=c.exp<today;return `<tr><td data-l="${t('Code','الكود')}"><b>${c.code}</b></td><td data-l=%>${c.pct}%</td><td data-l="${t('Expires','ينتهي')}">${c.exp}</td><td data-l="${t('Status','الحالة')}"><span class="${ex?'er':c.active?'ok':'m'}">${ex?t('Expired','منتهي'):c.active?t('Active','فعّال'):t('Paused','متوقف')}</span></td><td><button class="btn o s" onclick="run(()=>api.coupon('${c.code}'))">${c.active?t('Pause','إيقاف'):t('Activate','تفعيل')}</button> <button class="btn d s" onclick="ask(t('Delete coupon?','حذف الكوبون؟'),()=>run(()=>api.coupon('${c.code}',1)))">${I('trash-2')}</button></td></tr>`}).join('')||`<tr><td colspan=5 class=m>${t('No coupons yet','لا كوبونات')}</td></tr>`}</table></div>`}
function cats(bid){const ps=S.products.filter(p=>p.brandId==bid&&!p.deleted),rv={};S.orders.filter(o=>o.brandId==bid&&live(o)).forEach(o=>o.items.forEach(i=>{const c=S.products.find(x=>x.id==i.pid)?.cat;rv[c]=(rv[c]||0)+i.qty*i.price}));
return `<h2>${t('Categories','الأقسام')}</h2><div class="card tw"><table class=rt><thead><tr><th>${t('Category','القسم')}</th><th>${t('Products','المنتجات')}</th><th>${t('Stock','المخزون')}</th><th>${t('Revenue','الإيراد')}</th><th>${t('Measurements','القياسات')}</th></tr></thead>${CATS.map(c=>{const x=ps.filter(p=>p.cat==c[0]);return `<tr><td data-l="${t('Category','القسم')}"><b>${cn(c[0])}</b></td><td data-l="${t('Products','المنتجات')}">${x.length}</td><td data-l="${t('Stock','المخزون')}">${x.reduce((a,p)=>a+stockOf(p),0)}</td><td data-l="${t('Revenue','الإيراد')}">${money(rv[c[0]]||0)}</td><td data-l="${t('Measurements','القياسات')}" class=m>${mf(c[0]).map(k=>t(...ML[k])).join(', ')||'–'}</td></tr>`}).join('')}</table></div>`}
function sett(bid){const b=brand(bid),f=(k,l)=>`<label>${l}<input id=s_${k} value="${E(b[k]||'')}"></label>`;
return `<h2>${t('Settings','الإعدادات')}</h2><div class=card><div class=cover style="height:120px;border-radius:10px;background:${cvr(b)}"></div><div class=row style="margin:-26px 10px 12px"><div class=bl style="background:${b.color};width:64px;height:64px;overflow:hidden">${lgo(b)}</div><span class=b>${b.status}</span></div><div class=row style="margin-bottom:12px"><label class="btn o s">${I('image-plus')}${t('Upload logo','رفع الشعار')}<input type=file accept="image/*" hidden onchange="bimg('logo',this.files)"></label><label class="btn o s">${I('image-plus')}${t('Upload cover','رفع الغلاف')}<input type=file accept="image/*" hidden onchange="bimg('cover',this.files)"></label>${b.logo?`<button class="btn g s" onclick="run(()=>api.saveBrand('${bid}',{logo:''}))">${t('Remove logo','حذف الشعار')}</button>`:''}${b.cover?`<button class="btn g s" onclick="run(()=>api.saveBrand('${bid}',{cover:''}))">${t('Remove cover','حذف الغلاف')}</button>`:''}</div><div class=f>${f('name',t('Brand name','اسم العلامة'))}${f('phone',t('Phone','الهاتف'))}${f('email',t('Email','البريد'))}${f('addr',t('Address','العنوان'))}${f('desc',t('Description','الوصف'))}<label>${t('Brand color','لون العلامة')}<input type=color id=s_color value="${b.color}"></label></div><button class=btn style="margin-top:12px" onclick="run(()=>api.saveBrand('${bid}',Object.fromEntries(['name','phone','email','addr','desc','color'].map(k=>[k,$('#s_'+k).value]))),t('Settings saved','تم الحفظ'))">${I('save')}${t('Save','حفظ')}</button></div>`}
function notif(){const u=U();if(u.role!='brand')return toast(t('No new notifications','لا إشعارات جديدة'));const bid=u.brandId,pe=S.orders.filter(o=>o.brandId==bid&&o.status=='Pending'),lo=S.products.filter(p=>p.brandId==bid&&!p.deleted).flatMap(p=>p.variants.filter(v=>v.stock<=LOW).map(v=>[p.name,v]));
modal(`<h2>${t('Notifications','الإشعارات')}</h2><a class=row href="#/dash/orders" onclick=closeM()>${I('clock')}${pe.length} ${t('pending orders','طلبات قيد الانتظار')}</a><hr style="border:0;border-top:1px solid var(--b)">${lo.slice(0,8).map(x=>`<a class=row href="#/dash/inventory" onclick=closeM() style="margin:4px 0">${I('alert-triangle')}${E(x[0])} ${E(x[1].color)}/${E(x[1].size)} – <b class="${x[1].stock?'wr':'er'}">${x[1].stock?t('only '+x[1].stock+' left','متبقي '+x[1].stock):t('out of stock','نفد')}</b></a>`).join('')||`<span class=m>${t('Stock levels are healthy','المخزون جيد')}</span>`}<br><button class="btn g" onclick=closeM()>${t('Close','إغلاق')}</button>`)}
const cvr=b=>b.cover?`url(${b.cover}) center/cover`:`linear-gradient(120deg,${b.color},#c4b5fd)`,lgo=b=>b.logo?`<img src="${b.logo}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:8px">`:E(b.name[0]);
function bimg(key,files,bid){const f=files[0],bad=()=>toast(t('Image upload failed','فشل رفع الصورة'));if(!f||!f.type.startsWith('image/'))return bad();bid=bid||U().brandId;const r=new FileReader();r.onerror=bad;r.onload=()=>{const im=new Image();im.onerror=bad;im.onload=()=>{const m=key=='logo'?300:1200,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);run(()=>api.saveBrand(bid,{[key]:c.toDataURL('image/jpeg',.8)}),t('Image saved','تم حفظ الصورة'))};im.src=r.result};r.readAsDataURL(f)}
/* ---------- platform admin ---------- */
function admin(){const live_=S.orders.filter(live),rev=live_.reduce((a,o)=>a+o.total,0);
return `<main><h2>${t('Platform admin','إدارة المنصة')}</h2><div class=stats>${[['store',t('Brands','العلامات'),S.brands.length],['wallet',t('Marketplace sales','مبيعات السوق'),money(rev)],['percent',t('Commission (10%)','العمولة (10%)'),money(rev*.1)],['package',t('All orders','كل الطلبات'),S.orders.length],['shirt',t('Products','المنتجات'),S.products.filter(p=>!p.deleted).length]].map(c=>`<div class="card stat">${I(c[0])}<div><span class=m>${c[1]}</span><b>${c[2]}</b></div></div>`).join('')}</div>
<div class=card style="margin-top:14px"><div class=row><h3 class=sp>${t('Brands','العلامات')}</h3><input id=nb placeholder="${t('New brand name','اسم العلامة')}"><button class=btn onclick="newBrand()">${I('plus')}${t('Add brand','إضافة')}</button></div><div class=tw><table class=rt><thead><tr><th>${t('Brand','العلامة')}</th><th>${t('Status','الحالة')}</th><th>${t('Products','المنتجات')}</th><th>${t('Sales','المبيعات')}</th><th></th></tr></thead>${S.brands.map(b=>`<tr><td data-l="${t('Brand','العلامة')}"><b>${E(b.name)}</b></td><td data-l="${t('Status','الحالة')}"><span class=b>${b.status}</span></td><td data-l="${t('Products','المنتجات')}">${S.products.filter(p=>p.brandId==b.id&&!p.deleted).length}</td><td data-l="${t('Sales','المبيعات')}">${money(S.orders.filter(o=>o.brandId==b.id&&live(o)).reduce((a,o)=>a+o.total,0))}</td><td><label class="btn g s" title="Logo">${I('image')}<input type=file accept="image/*" hidden onchange="bimg('logo',this.files,'${b.id}')"></label> <label class="btn g s" title="Cover">${I('panel-top')}<input type=file accept="image/*" hidden onchange="bimg('cover',this.files,'${b.id}')"></label> ${b.status!='Active'?`<button class="btn s" onclick="bs('${b.id}','Active')">${I('check')}${t('Approve','اعتماد')}</button>`:`<button class="btn d s" onclick="bs('${b.id}','Suspended')">${t('Suspend','إيقاف')}</button>`}</td></tr>`).join('')}</table></div></div></main>`}
function newBrand(){const n=$('#nb').value.trim();if(!n)return;if(S.brands.some(b=>b.name.toLowerCase()==n.toLowerCase()))return toast(t('Brand already exists','العلامة موجودة'));S.brands.push({id:'b'+Date.now(),name:n,color:'#4c1d95',desc:'',status:'Pending',rating:0,phone:'',email:''});save();render()}
function bs(id,s){brand(id).status=s;save();render()}
if(!location.hash)location.hash='#/';render();
</script></body></html>
